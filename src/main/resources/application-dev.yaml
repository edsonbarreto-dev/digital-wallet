# Perfil DEV — para rodar e demonstrar localmente sem infra externa.
# Ative com: SPRING_PROFILES_ACTIVE=dev  (ou --spring.profiles.active=dev)
# Producao continua usando PostgreSQL (application.yaml / variaveis de ambiente).
spring:
  datasource:
    url: jdbc:h2:mem:wallet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
